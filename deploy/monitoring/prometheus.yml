# Prometheus scrape config for the offline node.
# Runs inside the air gap; no remote_write, no federation, no external DNS.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    site: airgapped
    service: srm-llm

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # llama.cpp exposes Prometheus text on /metrics when started with --metrics.
  # No auth: llama-server does not require the API key on /metrics.
  - job_name: llama-server
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          instance: t1-primary

  # Host resources: GPU memory/temperature and CPU/RAM. node_exporter and
  # dcgm-exporter both run locally; nothing leaves the machine.
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: nvidia-dcgm
    static_configs:
      - targets: ["127.0.0.1:9400"]
