    role: primary
    repo: unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF
    files:
      - name: Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
        size_gib: 17.28
        sha256: ""          # 采集区填：见 docs/llm_agent/离线部署实施手册.md §3.3
    ctx_default: 8192
    ctx_max: 32768
    quant: Q4_K_M
    bytes_per_param: 4.53

