name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core only, offline engine)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"
      - name: Lint
        run: ruff check src
      - name: Unit + integration tests
        run: PYTHONPATH=src pytest tests/unit tests/integration -q
      - name: Verification (V&V) cases
        run: PYTHONPATH=src pytest tests/verification -m verification -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and smoke-test the CLI
        run: |
          pip install dist/*.whl
          srm templates
          srm thermo --propellant ap_htpb_80
