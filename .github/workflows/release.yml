name: Release

# Tag-driven release: push a tag like ``v0.1.0`` and this publishes
#   srm.exe (Windows, no runtime needed)  +  wheel  +  sdist  +  SHA256SUMS
# to a GitHub Release.  The binaries stay out of git history; only the tag and
# the release assets carry them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # Fail fast on a tag that does not match the version baked into the package,
  # so a release can never ship a binary that reports the wrong number.
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: v
        name: Tag matches package version
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          mod=$(python3 -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',pathlib.Path('src/srm_open/__init__.py').read_text()).group(1))")
          echo "tag=$tag pyproject=$pkg module=$mod"
          [ "$tag" = "v$pkg" ] || { echo "::error::tag $tag != v$pkg"; exit 1; }
          [ "$pkg" = "$mod" ] || { echo "::error::pyproject $pkg != __init__ $mod"; exit 1; }
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

  windows-exe:
    needs: version-check
    # Build natively on Windows. The Wine-in-Docker path used by
    # packaging/build_windows_exe.sh works on a workstation but not on GitHub's
    # runners: the default seccomp profile blocks a socket syscall Wine needs
    # ("wine: socket : Function not implemented"), so the image build dies
    # before PyInstaller starts.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime + build dependencies
        # `--extra all` is deliberately avoided: it pulls the Fortran
        # thermochemistry backends (rocketcea/cantera) which need a compiler
        # toolchain and are optional.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,viz,optimize]" pyinstaller

      - name: Build srm.exe
        run: pyinstaller packaging/srm_open.spec --noconfirm --distpath dist --workpath build/pyi

      - name: Smoke-test the frozen binary
        # A binary that cannot design a motor is not a release artefact.
        run: |
          dist\srm.exe design --thrust 4000 --burn-time 2.5 | Tee-Object -FilePath design.txt
          if (-not (Select-String -Path design.txt -Pattern "verification      : 8/8 passed" -Quiet)) {
            throw "design smoke test did not report 8/8"
          }

      - name: Verify the embedded web UI serves
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\srm.exe" `
                 -ArgumentList "serve","--host","127.0.0.1","--port","18000" -PassThru
          try {
            $up = $false
            foreach ($i in 1..40) {
              try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 `
                      "http://127.0.0.1:18000/ui/" | Out-Null; $up = $true; break }
              catch { Start-Sleep -Seconds 3 }
            }
            if (-not $up) { throw "server never came up" }
            foreach ($path in "/ui/","/ui/app.js","/families","/propellants") {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 "http://127.0.0.1:18000$path"
              Write-Host "$path -> $($r.StatusCode)"
              if ($r.StatusCode -ne 200) { throw "$path returned $($r.StatusCode)" }
            }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Checksums
        shell: bash
        run: |
          mkdir -p release
          cp dist/srm.exe release/srm.exe
          cd release
          sha256sum srm.exe > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: srm-exe
          path: |
            release/srm.exe
            release/SHA256SUMS

  python-dist:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel in a clean venv and smoke-test
        # Guards the packaging contract: the databases must ship inside the wheel.
        run: |
          set -eu
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q dist/*.whl
          cd /tmp
          /tmp/v/bin/srm design --thrust 4000 --burn-time 2.5 | tee /tmp/d.txt
          grep -q "verification      : 8/8 passed" /tmp/d.txt
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish:
    needs: [version-check, windows-exe, python-dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Flatten artefacts
        run: |
          mkdir -p out
          cp assets/srm-exe/srm.exe out/
          cp assets/srm-exe/SHA256SUMS out/
          cp assets/python-dist/*.whl assets/python-dist/*.tar.gz out/
          ls -lh out/
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Srm-Open ${{ needs.version-check.outputs.version }}
          generate_release_notes: true
          body: |
            Srm-Open ${{ needs.version-check.outputs.version }} — 固体火箭发动机药型设计
            （教学、科研与非商业工业研发用途）

            | 文件 | 平台 | 说明 |
            |---|---|---|
            | `srm.exe` | Windows x86_64 | 免安装，内置数据库与浏览器 UI |
            | `srm_open-*.whl` | 全平台 | `pip install srm_open-*.whl` |
            | `srm_open-*.tar.gz` | 全平台 | 源码分发包 |

            校验：`sha256sum -c SHA256SUMS`（Windows 用
            `certutil -hashfile srm.exe SHA256`）。

            ```powershell
            .\srm.exe design --thrust 4000 --burn-time 2.5
            .\srm.exe serve          # http://127.0.0.1:8000/ui/
            ```

            **边界**：本工具输出为初步设计级估算，不构成可用于发动机定型、
            试验或生产的工程结论；禁止用于武器化或违反适用法律的用途。
            详见 `LICENSE` 与 `docs/` 中的适用范围说明。
          files: out/*
          fail_on_unmatched_files: true
